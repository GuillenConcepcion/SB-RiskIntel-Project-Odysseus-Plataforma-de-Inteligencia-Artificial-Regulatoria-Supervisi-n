version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sb-riskintel-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_PORT=8000
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./models_registry:/app/models_registry:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - redis

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: sb-riskintel-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - api
      - redis
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./models_registry:/app/models_registry:ro

  redis:
    image: redis:7-alpine
    container_name: sb-riskintel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

