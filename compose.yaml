version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sb-riskintel-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - API_PORT=8000
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./models_registry:/app/models_registry:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: sb-riskintel-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./models_registry:/app/models_registry:ro
