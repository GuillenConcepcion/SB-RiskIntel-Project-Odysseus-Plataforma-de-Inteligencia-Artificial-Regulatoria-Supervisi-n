[project]
name = "sb-riskintel"
version = "0.1.0"
description = "Financial Supervision & Regulatory Conduct Risk Intelligence Platform (SupTech & MLOps) - Superintendencia de Bancos de la República Dominicana"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Guillén Concepción", email = "guillenconcepcion@gmail.com" }
]
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "joblib>=1.4.0",
    "lightgbm>=4.5.0",
    "matplotlib>=3.9.0",
    "mlflow>=2.17.0",
    "numba>=0.59.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "pandera>=0.20.0",
    "plotly>=5.24.0",
    "polars>=1.12.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pytest>=8.3.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.0",
    "shap>=0.45.0",
    "statsmodels>=0.14.0",
    "streamlit>=1.39.0",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
    "uvicorn[standard]>=0.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".virtual_documents", ".ipynb_checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401", "B905", "I001"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
